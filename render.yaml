services:
  - type: web
    name: finance-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_URL
        value: https://integrate.api.nvidia.com/v1/chat/completions
      - key: LLM_MODEL
        value: meta/llama-3.2-11b-vision-instruct

  - type: web
    name: finance-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
