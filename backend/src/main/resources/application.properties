spring.application.name=finance-app

# Embedded MongoDB (Flapdoodle)
de.flapdoodle.mongodb.embedded.version=7.0.0
spring.data.mongodb.database=finance_app

# Relational Database (JPA / Persistent H2 with MySQL mode & utf8mb4 collation)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/financedb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Unicode & UTF-8 / utf8mb4 connection parameters
spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true

# Server
server.port=8080

# JWT
jwt.secret=FinanceApp2024SecretKeyForJWTAuthenticationVeryLongAndSecureKey12345
jwt.expiration=86400000

# Logging
logging.level.com.financeapp=DEBUG

# LLM Provider Configuration (Injected securely via environment variables or configured defaults)
llm.api.key=${LLM_API_KEY:${OPENAI_API_KEY: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}}
llm.api.url=${LLM_API_URL:https://integrate.api.nvidia.com/v1/chat/completions}
llm.api.model=${LLM_MODEL:meta/llama-3.2-11b-vision-instruct}
llm.api.timeout-seconds=45
